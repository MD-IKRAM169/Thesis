name: Thesis document integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  document-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated unit tests
        run: python -m unittest discover -s tests -v
      - name: Check original PDF and PowerPoint container structures
        run: python tools/verify_artifacts.py
